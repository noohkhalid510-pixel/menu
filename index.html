<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a shop-window header, then a filterable grid of item tags (like price tags on a shelf). */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --ink:#1f3330; --muted:#5d6f6b;
  --accent:#c2416b; --accent-soft:#f7dde6; --line:#dbe2dc; --ok:#2f7a4f; --warn:#a15c00;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121b1a; --surface:#1a2725; --ink:#e7efec; --muted:#9db0ab;
    --accent:#f07fa3; --accent-soft:#3a2230; --line:#2b3b38; --ok:#6fcf97; --warn:#f0b45a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121b1a; --surface:#1a2725; --ink:#e7efec; --muted:#9db0ab;
  --accent:#f07fa3; --accent-soft:#3a2230; --line:#2b3b38; --ok:#6fcf97; --warn:#f0b45a;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);background:var(--surface)}
.head{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;padding-top:28px;padding-bottom:22px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,5vw,2.8rem);line-height:1.1;margin:0;text-wrap:balance}
.tagline{margin:6px 0 0;color:var(--muted);max-width:60ch}
.info{display:grid;gap:2px;font-size:.92rem;color:var(--muted);text-align:right}
.info strong{color:var(--ink);font-weight:600}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.controls .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding-top:14px;padding-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 auto}
.chip{font:inherit;font-size:.92rem;font-weight:500;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:0 1 260px;min-width:180px}
.search input{width:100%;font:inherit;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{padding:28px 0 60px}
.section{display:grid;gap:14px;margin-bottom:36px}
.section h2{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0;display:flex;gap:10px;align-items:baseline}
.section h2 span{font-family:var(--body);font-size:.85rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{display:grid;grid-template-rows:auto 1fr;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;padding:0}
.card:hover{border-color:var(--accent)}
.card.out{opacity:.6}
.thumb{aspect-ratio:4/3;display:grid;place-items:center;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .mono{font-family:var(--display);font-size:2.6rem;color:rgba(0,0,0,.55)}
.badge{position:absolute;top:10px;left:10px;font-size:.75rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--surface);color:var(--ink)}
.badge.new{background:var(--accent);color:#fff}
.badge.out{background:var(--ink);color:var(--bg)}
.body{display:grid;gap:6px;padding:14px 16px 16px;align-content:start}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.name{font-weight:600;font-size:1.05rem}
.price{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.desc{color:var(--muted);font-size:.93rem;margin:0}
.empty{padding:40px 0;color:var(--muted)}
dialog{border:none;border-radius:16px;padding:0;max-width:520px;width:calc(100% - 32px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,18,.55)}
.dlg-body{display:grid;gap:10px;padding:20px 22px 22px}
.dlg-body h3{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0}
.dlg-body .meta{display:flex;flex-wrap:wrap;gap:8px;font-size:.88rem;color:var(--muted)}
.close{justify-self:end;font:inherit;font-weight:600;padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.stock-in{color:var(--ok);font-weight:600}.stock-low{color:var(--warn);font-weight:600}
footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:.9rem}
/* Timer pill shown to customers */
.timer{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;display:flex;gap:8px;align-items:center;padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:.95rem;box-shadow:0 6px 20px rgba(0,0,0,.2);font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.soon{background:var(--accent);color:#fff}
body.has-timer main{padding-bottom:90px}
/* Full-screen messages: expired / scan / counter */
.screen{min-height:100vh;display:grid;place-items:center;padding:32px 20px;text-align:center}
.screen-box{display:grid;gap:14px;justify-items:center;max-width:460px}
.screen h2{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,6vw,2.4rem);line-height:1.15;margin:0;text-wrap:balance}
.screen p{margin:0;color:var(--muted);font-size:1.1rem}
.screen .shop{font-family:var(--display);color:var(--accent);font-size:1.15rem}
.qr-icon{width:84px;height:84px;color:var(--accent)}
.btn{font:inherit;font-weight:600;font-size:1rem;padding:12px 22px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.counter .screen-box{max-width:640px;gap:18px}
.counter h2{font-size:clamp(2.2rem,6vw,3.4rem)}
.qr{background:#fff;padding:18px;border-radius:20px;border:1px solid var(--line);width:min(78vw,420px);aspect-ratio:1}
.qr svg,.qr img{width:100%;height:100%;display:block}
.steps{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;color:var(--muted);font-size:1.05rem;list-style:none;padding:0;margin:0}
.steps b{color:var(--accent)}
.small{font-size:.85rem!important}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.actions:empty{display:none}
.warning{font-size:.85rem;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:6px}
@media (max-width:600px){
  .info{text-align:left}.search{flex:1 1 100%}
  .head{padding-top:20px;padding-bottom:16px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
  .chip{flex:0 0 auto}
  .grid{grid-template-columns:1fr;gap:10px}
  .card{grid-template-rows:none;grid-template-columns:88px 1fr}
  .card .thumb{aspect-ratio:auto;min-height:100%}
  .card .thumb .mono{font-size:1.5rem}
  .card .badge{top:6px;left:6px;font-size:.62rem;padding:2px 6px}
  .card .body{padding:12px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<!-- Counter display: put this on a tablet at the register -->
<section class="screen counter" id="counterView" hidden>
  <div class="screen-box">
    <h2>Scan for menu</h2>
    <div class="qr" id="qr" role="img" aria-label="QR code that opens the menu"></div>
  </div>
</section>

<!-- Shown when the link has no code, a bad code, or the time is up -->
<section class="screen" id="gateView" hidden>
  <div class="screen-box">
    <svg class="qr-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>
    <h2 id="gateTitle"></h2>
  </div>
</section>

<div id="menuView" hidden>

<div class="controls">
  <div class="wrap">
    <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
    <label class="search"><span class="sr" hidden>Search items</span>
      <input id="search" type="search" placeholder="Search" aria-label="Search items">
    </label>
  </div>
</div>

<main class="wrap" id="menu"></main>

<div class="timer" id="timer" role="status" aria-live="polite"></div>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="thumb" id="dlgThumb"></div>
  <div class="dlg-body">
    <div class="row"><h3 id="dlgTitle"></h3><span class="price" id="dlgPrice"></span></div>
    <div class="meta" id="dlgMeta"></div>
    <p class="desc" id="dlgDesc"></p>
    <button class="close" id="dlgClose" type="button">Close</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* =====================================================
   EDIT YOUR SHOP HERE
   - Change the shop details below.
   - Add, remove or edit items in ITEMS.
   - status: "in" (in stock), "low" (only a few left), "out" (sold out)
   - isNew: true shows a "New" badge
   ===================================================== */
const SHOP = {
  currency: "$"
};

/* QR code settings
   MENU_URL  this page's link. Leave it as "" and the page uses whatever web address it is hosted at.
   OPEN_HOUR the hour the daily QR code changes (24-hour clock, 9 = 9am). Yesterday's code stops working at this time.
   MINUTES   how long the menu stays open after each scan                                                   */
const MENU_URL = "" || (/claude/.test(location.hostname) || location.protocol === "file:"
  ? "https://claude.ai/artifact/V3qL1bVvbBNZo5rZMBsBjz"
  : location.origin + location.pathname);
const OPEN_HOUR = 9;
const MINUTES = 10;
const SECRET = "shop-7Rk2"; // change this to cancel today's code immediately

const ITEMS = [
  { name:"Disposable Vape 5000 Puffs", category:"Disposable Vapes", price:20, desc:"Rechargeable disposable. 5% nicotine. Flavors: Blue Razz, Watermelon Ice, Mint, Strawberry Kiwi.", status:"in", isNew:true, color:"#cfd8f2" },
  { name:"Disposable Vape 10000 Puffs", category:"Disposable Vapes", price:28, desc:"Large-capacity disposable with screen display. 5% nicotine. Ask for current flavors.", status:"in", color:"#e3d3f0" },
  { name:"Zero-Nicotine Disposable", category:"Disposable Vapes", price:15, desc:"Same flavors with 0% nicotine. About 3000 puffs.", status:"low", color:"#d6ebe3" },

  { name:"Refill Pods (2-pack)", category:"Pods & Cartridges", price:14, desc:"Pre-filled pods for refillable pod devices. 3% or 5% nicotine.", status:"in", color:"#f2dccb" },
  { name:"Empty Refillable Cartridges (3-pack)", category:"Pods & Cartridges", price:10, desc:"Fill with your own e-liquid. Fits most pod systems; ask us to check yours.", status:"in", color:"#dfe3ea" },
  { name:"Replacement Coils (5-pack)", category:"Pods & Cartridges", price:16, desc:"Mesh coils for tank devices. 0.4 and 0.8 ohm available.", status:"out", color:"#e8e2d2" },

  { name:"Salt Nic E-Liquid 30ml", category:"E-Liquids", price:18, desc:"Smooth nicotine salt e-liquid. 35mg or 50mg. Fruit, menthol and dessert flavors.", status:"in", color:"#f6e3b4" },
  { name:"Freebase E-Liquid 60ml", category:"E-Liquids", price:22, desc:"For tank and sub-ohm devices. 0mg, 3mg or 6mg.", status:"in", isNew:true, color:"#f4d5dc" },

  { name:"Cigarettes (pack)", category:"Tobacco", price:11, desc:"Most major brands in stock. Ask the counter for current pricing by brand.", status:"in", color:"#e7d7bf" },
  { name:"Rolling Tobacco 1.4oz", category:"Tobacco", price:16, desc:"Loose-leaf tobacco pouch. Regular and smooth blends.", status:"in", color:"#dcc6b4" },
  { name:"Nicotine Pouches", category:"Tobacco", price:6, desc:"Tobacco-free pouches. Mint, wintergreen and citrus. 3mg or 6mg.", status:"low", color:"#cfe0d8" },

  { name:"Single Premium Cigar", category:"Cigars", price:9, desc:"Hand-rolled cigars from our humidor. Ask for today's selection.", status:"in", color:"#e2cdb6" },
  { name:"Cigarillos (2-pack)", category:"Cigars", price:2, desc:"Machine-made cigarillos in several flavors.", status:"in", color:"#efe0c8" },

  { name:"Pod Device Kit", category:"Accessories", price:30, desc:"Refillable pod starter kit with USB-C charging. Includes one empty pod.", status:"in", color:"#d3e6e3" },
  { name:"Lighter", category:"Accessories", price:3, desc:"Disposable lighters. Torch lighters also available.", status:"in", color:"#f2cfd8" },
  { name:"Rolling Papers & Tips", category:"Accessories", price:3, desc:"King-size papers and filter tips.", status:"in", color:"#d9cdf0" }
];
/* ===================================================== */

const $ = s => document.querySelector(s);
const money = n => SHOP.currency + (Number.isInteger(n) ? n : n.toFixed(2));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials = n => n.split(/\s+/).filter(w=>/[A-Za-z]/.test(w[0])).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const thumbHTML = it => `${it.image ? `<img src="${esc(it.image)}" alt="">` : `<span class="mono" aria-hidden="true">${initials(it.name)}</span>`}`;
const badgeHTML = it => it.status==="out" ? `<span class="badge out">Sold out</span>` : it.isNew ? `<span class="badge new">New</span>` : "";

/* ---------- Daily access code: #menu-<day><check> ---------- */
function dayKey(){ const t = new Date(Date.now() - OPEN_HOUR*3600000); return t.getFullYear()*10000 + (t.getMonth()+1)*100 + t.getDate(); }
function check(k){ let h = 2166136261; for (const c of SECRET + ":" + k){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36).slice(-5).padStart(5,"0"); }
const makeCode = k => "menu-" + k.toString(36) + check(k);
function readCode(hash){
  const m = /^#menu-([0-9a-z]+)$/.exec(hash || ""); if (!m || m[1].length < 6) return null;
  const k = parseInt(m[1].slice(0,-5), 36);
  return check(k) === m[1].slice(-5) ? k : null;
}


const categories = ["All", ...new Set(ITEMS.map(i => i.category))];
let active = "All";
try { const saved = localStorage.getItem("giftCat"); if (categories.includes(saved)) active = saved; } catch(e){}

function renderChips(){
  $("#chips").innerHTML = categories.map(c =>
    `<button class="chip" type="button" aria-pressed="${c===active}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
}
function render(){
  const q = $("#search").value.trim().toLowerCase();
  const list = ITEMS.filter(i => (active==="All" || i.category===active) &&
    (!q || (i.name+" "+i.desc+" "+i.category).toLowerCase().includes(q)));
  if (!list.length){ $("#menu").innerHTML = `<p class="empty">No items match “${esc(q)}”. Try another word or pick “All”.</p>`; return; }
  const groups = {};
  list.forEach(i => (groups[i.category] ||= []).push(i));
  $("#menu").innerHTML = Object.entries(groups).map(([cat, items]) => `
    <section class="section" aria-label="${esc(cat)}">
      <h2>${esc(cat)} <span>${items.length} item${items.length>1?"s":""}</span></h2>
      <div class="grid">${items.map(it => `
        <button class="card ${it.status==="out"?"out":""}" type="button" data-idx="${ITEMS.indexOf(it)}">
          <div class="thumb" style="background:${esc(it.color||"#e5e9e4")}">${thumbHTML(it)}${badgeHTML(it)}</div>
          <div class="body">
            <div class="row"><span class="name">${esc(it.name)}</span><span class="price">${money(it.price)}</span></div>
            <p class="desc">${esc(it.desc)}</p>
          </div>
        </button>`).join("")}
      </div>
    </section>`).join("");
}

$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  active = b.dataset.cat; try { localStorage.setItem("giftCat", active); } catch(e){}
  renderChips(); render();
});
$("#search").addEventListener("input", render);

const dlg = $("#dlg");
$("#menu").addEventListener("click", e => {
  const c = e.target.closest(".card"); if (!c) return;
  const it = ITEMS[c.dataset.idx];
  $("#dlgThumb").style.background = it.color || "#e5e9e4";
  $("#dlgThumb").innerHTML = thumbHTML(it) + badgeHTML(it);
  $("#dlgTitle").textContent = it.name;
  $("#dlgPrice").textContent = money(it.price);
  $("#dlgDesc").textContent = it.desc;
  const stock = it.status==="out" ? `<span>Sold out, ask us when it's back</span>` :
                it.status==="low" ? `<span class="stock-low">Only a few left</span>` : `<span class="stock-in">In stock</span>`;
  $("#dlgMeta").innerHTML = `<span>${esc(it.category)}</span><span aria-hidden="true">·</span>${stock}`;
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open","");
});
$("#dlgClose").addEventListener("click", () => dlg.close ? dlg.close() : dlg.removeAttribute("open"));
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

/* ---------- Views ---------- */
let tick = null;
const show = id => ["counterView","gateView","menuView"].forEach(v => $("#"+v).hidden = v !== id);

function gate(title){
  if (dlg.open) dlg.close();
  $("#gateTitle").textContent = title;
  document.body.classList.remove("has-timer"); $("#menu").innerHTML = "";
  show("gateView");
}

function counter(){
  show("counterView");
  let shown = null;
  const draw = () => {
    const k = dayKey(); if (k === shown) return;
    try {
      const q = qrcode(0, "M"); q.addData(MENU_URL + "#" + makeCode(k)); q.make();
      $("#qr").innerHTML = q.createSvgTag({ scalable: true, margin: 0 }); shown = k;
    } catch(e){ $("#qr").textContent = "The QR code could not load. Check this screen's internet connection, then reload."; }
  };
  draw();
  tick = setInterval(draw, 60000); // switches to the new code by itself at opening time
}

const timeUp = () => gate("Time\u2019s up. Scan again.");

function menu(){
  const ends = Date.now() + MINUTES * 60000; // every fresh scan starts a new countdown
  const update = () => {
    const left = ends - Date.now();
    if (left <= 0){ clearInterval(tick); timeUp(); return; }
    const m = Math.floor(left/60000), s = Math.floor(left/1000) % 60;
    const t = $("#timer");
    t.textContent = `${m}:${String(s).padStart(2,"0")}`;
    t.classList.toggle("soon", left < 3*60000);
  };
  show("menuView"); document.body.classList.add("has-timer");
  renderChips(); render(); update();
  tick = setInterval(update, 1000);
}

function route(){
  clearInterval(tick);
  const hash = location.hash;
  if (hash === "#counter") return counter();
  const k = readCode(hash);
  if (k === null) return gate("Scan the code in store.");
  if (k !== dayKey()) return gate("Scan the code in store.");
  menu();
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
